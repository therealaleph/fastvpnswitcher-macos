name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-build-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: ./test.sh
      - name: Build
        run: ./build.sh
      - name: Package
        run: ./package.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FastVPN-Switcher
          path: |
            dist/FastVPN-Switcher.zip
            dist/FastVPN-Switcher.dmg
